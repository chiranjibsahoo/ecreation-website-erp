<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="full-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="full-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="full-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="full-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Emblem Group (Height: 64, Width: 64) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#full-bg)" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Monogram Paths -->
    <g filter="url(#full-shadow)">
      <!-- Vertical Spine -->
      <rect x="15" y="16" width="9" height="34" rx="4.5" fill="url(#full-blue)" />

      <!-- Top Arm -->
      <path d="M 19 16 L 43 16 C 46 16 48 18 48 21 C 48 24 46 26 43 26 L 19 26 Z" fill="url(#full-blue)" />
      <circle cx="43" cy="21" r="2.5" fill="#FFFFFF" />

      <!-- Middle Arrow -->
      <path d="M 19 30 L 35 30 L 40 34 L 35 38 L 19 38 Z" fill="url(#full-cyan)" />
      <circle cx="33" cy="34" r="2" fill="#FFFFFF" />

      <!-- Bottom Arm -->
      <path d="M 19 42 L 43 42 C 46 42 48 44 48 47 C 48 50 46 52 43 52 L 19 52 Z" fill="url(#full-blue)" />
      <circle cx="43" cy="47" r="2.5" fill="#FFFFFF" />

      <!-- Connecting Node Trail -->
      <path d="M 48 24 L 51 29 L 51 40 L 48 45" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
      <circle cx="51" cy="34" r="1.5" fill="#38BDF8" />
    </g>
  </g>

  <!-- Typography: Ecreation IT Solution -->
  <g transform="translate(86, 42)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5" fill="#0F172A">
      Ecreation
    </text>
    <text x="1" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="3" fill="#2563EB">
      IT SOLUTION
    </text>
  </g>
</svg>

