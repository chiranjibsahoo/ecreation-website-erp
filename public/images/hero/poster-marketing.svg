<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow-mkt" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#292524" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#1C1917" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="gold-curve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78716C" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="mkt-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#F59E0B" stroke-width="0.6" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-glow-mkt)" />
  <rect width="1920" height="1080" fill="url(#mkt-grid)" />

  <!-- Ascending Revenue & SEO Growth Curve -->
  <path d="M 180 860 Q 560 780 880 540 T 1740 200" fill="none" stroke="url(#gold-curve)" stroke-width="4" opacity="0.65" />
  <g fill="#F59E0B" opacity="0.75">
    <circle cx="520" cy="720" r="7" />
    <circle cx="880" cy="540" r="9" />
    <circle cx="1320" cy="340" r="9" />
    <circle cx="1740" cy="200" r="12" fill="#FDE68A" />
  </g>
</svg>